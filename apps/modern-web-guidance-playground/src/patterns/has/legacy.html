<p>The card's theme and highlight follow its children's state. JS listens and toggles classes on the parent:</p>
<div class="theme-card" id="theme-card">
  <label class="toggle-row">
    <input type="checkbox" class="theme-toggle" id="theme-toggle" />
    Dark mode
  </label>
  <h3>Reading list</h3>
  <p>Focus the field below and watch the whole card react:</p>
  <input type="text" class="note-input" id="note-input" placeholder="Add a note…" />
</div>
