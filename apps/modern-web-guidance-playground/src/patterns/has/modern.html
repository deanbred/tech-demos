<p>The same card styled straight from its children's state with <code>:has()</code> — no listeners, no classes:</p>
<div class="theme-card">
  <label class="toggle-row">
    <input type="checkbox" class="theme-toggle" />
    Dark mode
  </label>
  <h3>Reading list</h3>
  <p>Focus the field below and watch the whole card react:</p>
  <input type="text" class="note-input" placeholder="Add a note…" />
</div>
