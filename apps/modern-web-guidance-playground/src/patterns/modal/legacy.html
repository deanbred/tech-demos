<p>A destructive-action confirmation, the way it was built before <code>&lt;dialog&gt;</code>:</p>
<button type="button" class="btn" id="open-modal">Delete item…</button>

<div class="overlay" id="overlay" hidden>
  <div
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
    id="modal"
  >
    <h2 id="modal-title">Delete this item?</h2>
    <p>This action cannot be undone.</p>
    <div class="modal-actions">
      <button type="button" class="btn" id="modal-cancel">Cancel</button>
      <button type="button" class="btn danger" id="modal-confirm">Delete</button>
    </div>
  </div>
</div>
