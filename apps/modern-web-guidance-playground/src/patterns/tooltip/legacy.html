<p>Tooltips positioned with JS math. The top button has no room above, so the code must detect the edge and flip:</p>
<div class="demo-row top-row">
  <button type="button" class="btn tip-trigger" data-tip="No room above me, so I flipped below">
    Near the top edge
  </button>
</div>
<div class="demo-row mid-row">
  <button type="button" class="btn tip-trigger" data-tip="Plenty of room, so I sit above">
    Middle of the page
  </button>
</div>
<div class="tooltip" id="tooltip" role="tooltip" hidden></div>
