<div class="demo-row top-row">
  <button type="button" class="btn" popovertarget="tip-top" aria-describedby="tip-top">
    Near the top edge
  </button>
  <div id="tip-top" popover role="tooltip" class="tooltip">
    No room above me, so the browser flipped me below
  </div>
</div>
<p class="explain">The same tooltips with the Popover API + CSS anchor positioning. The browser does the math and flips at edges — no JS. Click a button to toggle its tooltip (light-dismiss works too):</p>
<div class="demo-row mid-row">
  <button type="button" class="btn" popovertarget="tip-mid" aria-describedby="tip-mid">
    Middle of the page
  </button>
  <div id="tip-mid" popover role="tooltip" class="tooltip">
    Plenty of room, so I sit above
  </div>
</div>
