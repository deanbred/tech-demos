<div id="list-view">
  <h3 id="list-heading" tabindex="-1">Palette</h3>
  <p>Pick a swatch to open its detail view:</p>
  <div class="thumbs">
    <button type="button" class="thumb" style="--c: #e2695e" data-name="Coral" aria-label="Coral"></button>
    <button type="button" class="thumb" style="--c: #5e9ee2" data-name="Sky" aria-label="Sky"></button>
    <button type="button" class="thumb" style="--c: #6ec28a" data-name="Mint" aria-label="Mint"></button>
  </div>
</div>

<div id="detail-view" hidden>
  <button type="button" class="btn" id="back">← Back</button>
  <div class="hero" id="hero"></div>
  <h3 id="detail-heading" tabindex="-1"></h3>
  <p>A much larger view of the same swatch.</p>
</div>
