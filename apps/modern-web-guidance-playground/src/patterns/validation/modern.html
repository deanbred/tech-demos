<p>The same deferred validation from HTML constraints + <code>:user-invalid</code>. The browser tracks the interaction state — no JS:</p>
<form>
  <div class="field">
    <label for="email">Email address</label>
    <span class="hint" id="email-hint">Format: you@example.com</span>
    <input
      type="email"
      id="email"
      name="email"
      required
      autocomplete="email"
      aria-describedby="email-hint"
    />
    <div class="error-msg" id="email-error">
      <span role="img" aria-label="Error">❌</span>
      Enter an email address in the format you@example.com.
    </div>
  </div>
  <div class="field">
    <label for="username">Username</label>
    <span class="hint" id="username-hint">3–12 lowercase letters or digits</span>
    <input
      type="text"
      id="username"
      name="username"
      required
      pattern="[a-z0-9]{3,12}"
      autocomplete="username"
      aria-describedby="username-hint"
    />
    <div class="error-msg" id="username-error">
      <span role="img" aria-label="Error">❌</span>
      Use 3–12 lowercase letters or digits.
    </div>
  </div>
</form>
